name: PSD Citywide
description: 'PSD Citywide is a SaaS provider of enterprise asset management (EAM) and
  public-sector software for North American municipalities and government organizations.
  Its integrated Citywide platform spans asset management, maintenance and work-order
  management, GIS integration (ESRI-powered mapping), permitting, planning and licensing
  with citizen portals, multi-year budgeting and forecasting, facility/space management
  (Spaces), and a field mobile app, alongside asset-management advisory and grant services.
  The homepage references a "robust API" for integration and customization, but no public
  developer portal, API reference, SDKs, or GitHub organization were found during enrichment;
  end-user product documentation is published in a HappyFox-powered help center. Added to
  the API Evangelist network via the norwest-venture-partners portfolio.'
